<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RTM 提货订单｜Enterprise Tabs</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{--surface:#FFFFFF;--workspace-canvas:#F5F7FA;--tabs-inactive-background:#E5E8ED;--brand-red:#E21413;--text-secondary:#606266;--sidebar-width:216px;--header-height:64px;font-family:"HarmonyOS Sans SC","Microsoft YaHei","PingFang SC",sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--workspace-canvas)}
    .base-page{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--workspace-canvas)}
    .enterprise-tabs{position:fixed;z-index:20;top:var(--header-height);right:0;left:var(--sidebar-width);display:flex;align-items:flex-end;gap:8px;height:40px;padding:0 24px;background:var(--workspace-canvas)}
    .tab{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:0;border-radius:4px 4px 0 0;background:var(--tabs-inactive-background);color:var(--text-secondary);font-size:14px;line-height:20px}
    .tab.active{background:var(--surface);color:var(--brand-red);font-weight:500}.tab-close{display:grid;place-items:center;width:16px;height:16px;padding:0;border:0;background:transparent;color:inherit}.tab-close:hover{color:var(--brand-red)}svg{width:16px;height:16px;stroke-width:2}
  </style>
</head>
<body>
  <iframe class="base-page" id="base-page" src="rtm-order-list-v3.4.html" title="RTM 提货订单列表"></iframe>
  <nav class="enterprise-tabs" aria-label="Enterprise 页面标签">
    <button class="tab" type="button">首页</button>
    <button class="tab closable" type="button">订单查询 <span class="tab-close" aria-label="关闭订单查询"><i data-lucide="x"></i></span></button>
    <button class="tab active closable" type="button" aria-current="page">提货订单 <span class="tab-close" aria-label="关闭提货订单"><i data-lucide="x"></i></span></button>
  </nav>
  <script>
    const basePage=document.querySelector('#base-page');
    basePage.addEventListener('load',()=>{
      const spacing=document.createElement('style');
      spacing.textContent='.main{padding-top:calc(var(--header) + 64px)!important}';
      basePage.contentDocument.head.append(spacing);
    });
    document.querySelectorAll('.tab-close').forEach(close=>close.addEventListener('click',event=>{event.stopPropagation();const tab=close.closest('.tab');if(!tab.classList.contains('active'))tab.remove()}));
    window.lucide?.createIcons({attrs:{'stroke-width':2}});
  </script>
</body>
</html>
